[package]
name = "scratchpad"
version = "0.2.0"
edition = "2024"
build = "build.rs"

[dependencies]
eframe = { version = "0.27", features = ["persistence"] }
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
regex = "1"
ron = "0.8"
arboard = "3"

[build-dependencies]
ico = "0.3"
winres = "0.1"
