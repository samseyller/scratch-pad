[package]
name = "scratchpad"
version = "0.3.0"
edition = "2024"
license = "MIT"
build = "build.rs"

[dependencies]
eframe = { version = "0.27", features = ["persistence"] }
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
regex = "1"
ron = "0.8"
arboard = "3"
semver = "1"
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[build-dependencies]
chrono = "0.4"
ico = "0.3"
winres = "0.1"
